teaser: title_fig_260526_wide.jpg
abstract: |
  Universal humanoid motion tracking is essential for enabling humanoid robots to perform diverse tasks in human environments. To capture the wide diversity of human motions, mixture-of-experts (MoE) policies have been widely adopted, leveraging dynamic routing to enhance policy expressiveness. However, we identify that divergence between old and updated policies can be misestimated during policy-gradient updates of MoE policies, due to their dynamic routing. Because most policy-gradient algorithms regulate policy updates based on the divergence, this misestimation can lead to either overly conservative or excessively large updates, which can yield a suboptimal policy. In this paper, we propose Mixture of Experts with Alternating Policy Optimization (MAPO), which alternately optimizes the router and the experts to avoid the divergence misestimation. As a result, MAPO achieves about $1.8\times$ higher reward than an MoE policy trained with an existing policy-gradient method. MAPO also attains the highest tracking success rate among the compared methods and the lowest tracking error across most error metrics, demonstrating its superior performance.

body:
  - title: Divergence Misestimation in MoE Policies
    text: |
      <img src="architecture_fig_260526.png" style="width:100%;" /> 

      Above Figure illustrates the differences in update mechanisms between MAPO and a standard policy gradient algorithm, PPO. Specifically, PPO measures the KL divergence of the mixed policy, while MAPO measures each component separately for clipping. When overestimation occurs, the measured divergence of the mixed policy can exceed the implicit trust region even though each component's update is admissible. In this case, MAPO still updates both components properly, whereas PPO blocks these admissible updates. When underestimation occurs, the mixed policy can stay within the trust region while individual components violate their own trust regions. MAPO properly clips each component, whereas PPO fails to clip the aggressive updates. Consequently, MAPO avoids the divergence misestimation in both cases, enabling more effective policy optimization.

  - title: Motion Comparison
    text: |
      <iframe width="100%" style="aspect-ratio:16/9;" src="https://www.youtube.com/embed/_jrAorztEDA" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>

      Representative motions where MAPO succeeds but PPO with MoE fails, under the same training setup. The selected motions require complex whole-body coordination, including sitting in mid-air, deep crouching, abrupt full-body turns, and one-footed spinning. These motions are selected from 182 cases on which MAPO consistently succeeds while PPO with MoE consistently fails across 5 independent trials, whereas the reverse occurs for only 1 motion.

  - title: Real-World Deployment
    text: |
      <iframe width="100%" style="aspect-ratio:16/9;" src="https://www.youtube.com/embed/ervAlZvyOo0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>

      The MAPO-trained policy can serve as an effective teacher for distillation. The robot successfully tracks a wide range of reference motions in the real world, including challenging ones that require precise balance, such as squatting and bowing.

